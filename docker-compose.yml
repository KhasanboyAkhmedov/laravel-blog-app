services:

  # ── PHP-FPM (Laravel) ─────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www                          # live code sync
      - /var/www/vendor                     # keep container vendor, don't overwrite
      - /var/www/node_modules               # keep container node_modules
    environment:
      - APP_ENV=local
    networks:
      - blog_net
    depends_on:
      db:
        condition: service_healthy

  # ── Nginx (web server) ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: blog_nginx
    restart: unless-stopped
    ports:
      - "8000:80"                           # http://localhost:8000
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - blog_net
    depends_on:
      - app

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: blog_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: blog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - db_data:/var/lib/postgresql/data   # data persists across restarts
    ports:
      - "5432:5432"                         # connect from host with psql or TablePlus
    networks:
      - blog_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Node (Vite build — runs once then exits) ──────────────────────────────
  node:
    image: node:22-alpine
    container_name: blog_node
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/node_modules
    command: sh -c "npm install && npm run build"
    profiles:
      - build                               # only runs with: docker-compose --profile build up node

volumes:
  db_data:                                  # named volume — data survives container removal

networks:
  blog_net:
    driver: bridge
