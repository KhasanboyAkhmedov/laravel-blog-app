services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: blog_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: blog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - blog_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blog_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── PHP-FPM (Laravel) ───────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_app
    restart: unless-stopped
    working_dir: /var/www
    entrypoint: ["sh", "docker/entrypoint.sh"]
    volumes:
      - .:/var/www
      - vendor_cache:/var/www/vendor
    env_file:
      - .env.docker
    networks:
      - blog_net
    depends_on:
      db:
        condition: service_healthy

  # ── Vite (hot-reload) ───────────────────────────────────────────────────────
  # Starts before nginx so nginx doesn't crash looking for vite
  vite:
    image: node:22-alpine
    container_name: blog_vite
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - node_modules_cache:/var/www/node_modules
    ports:
      - "5300:5173"
    command: sh -c "npm install && npm run dev"
    networks:
      - blog_net

  # ── Nginx ───────────────────────────────────────────────────────────────────
  # Starts last — after app and vite are up
  nginx:
    image: nginx:alpine
    container_name: blog_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - blog_net
    depends_on:
      - app
      - vite

volumes:
  db_data:
  vendor_cache:
  node_modules_cache:

networks:
  blog_net:
    driver: bridge
