################################################################################
#  PROD — docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
#  What changes from dev:
#    - Vite is REMOVED (assets are pre-built into public/build)
#    - PHP runs with opcache ON (faster)
#    - APP_ENV = production
#    - No volume sync (code is baked into the image)
################################################################################

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod      # separate prod Dockerfile (see below)
    volumes: []                         # no live code sync — code is inside image
    env_file:
      - .env.production                 # your real production secrets
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

  nginx:
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf

  # Remove the vite service entirely in prod
  vite:
    deploy:
      replicas: 0

  db:
    ports: []                           # don't expose DB port publicly in prod
